<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripClear</title>

<style>
body {
font-family: Arial, sans-serif;
background: linear-gradient(180deg,#f8fafc,#eef2f7);
margin:0;
padding:60px 20px;
}

.container {
max-width:620px;
margin:auto;
background:white;
padding:40px;
border-radius:14px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

h1 {
text-align:center;
margin-bottom:30px;
font-size:28px;
letter-spacing:.3px;
}

label {
font-weight:600;
display:block;
margin-top:22px;
margin-bottom:6px;
font-size:14px;
color:#333;
letter-spacing:.2px;
}

input, textarea, select {
width:100%;
padding:12px;
border:1px solid #e3e3e3;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
background:#fafafa;
transition:border .2s, box-shadow .2s;
}

input:focus, textarea:focus, select:focus {
outline:none;
border:1px solid #000;
box-shadow:0 0 0 2px rgba(0,0,0,.05);
background:white;
}

button {
width:100%;
margin-top:25px;
padding:16px;
background:black;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover {
opacity:.9;
}

#status {
text-align:center;
margin-top:20px;
font-weight:bold;
}
  
  /* Airline scrollbox styling */
select[multiple]{
height:160px;
background:white;
border:1px solid #e3e3e3;
padding:8px;
}

select[multiple] option{
padding:6px;
}
  
</style>
</head>

<body>

<div class="container">
<h1>TripClear Checklist Generator</h1>

<form id="tripForm">

<label>Departure country</label>
<input name="departure" required>

<label>Destination and layover countries</label>
<textarea name="route" required></textarea>

<p style="font-size:13px;color:#666;margin-top:4px;">
List all countries you will visit or transit through. Include layovers. Example: Turkey, Thailand, Japan
</p>

<label>Select airline(s)</label>

<select name="airlines" multiple required size="6">

<option>Lufthansa</option>
<option>Emirates</option>
<option>British Airways</option>
<option>Qatar Airways</option>
<option>Swiss International Airlines</option>
<option>KLM</option>
<option>Air France</option>
<option>United Airlines</option>
<option>American Airlines</option>
<option>Delta Air Lines</option>
<option>Korean Air</option>
<option>Etihad</option>

</select>

<p style="font-size:13px;color:#666;margin-top:4px;">
Hold <b>Ctrl</b> (Windows) or <b>Command</b> (Mac) to select multiple airlines.
</p>

<label>Cabin class</label>
<select name="cabin">
<option>Economy</option>
<option>Premium Economy</option>
<option>Business</option>
<option>First</option>
</select>

<label>What is the baggage plan for this trip?</label>
<select name="baggage_plan">
<option>Carry-on only</option>
<option>Carry-on + checked bag</option>
<option>Not sure</option>
</select>

<label>Would you like information on vaccination or immunization requirements for your destination(s)?</label>
<select name="vaccines">
<option>Yes</option>
<option>No</option>
</select>

<label>Does your trip include layovers?</label>
<select name="layovers">
<option selected>Yes</option>
<option>No</option>
</select>

<label>Traveling with Rx medication?</label>
<select name="rx">
<option>No</option>
<option>Yes</option>
</select>

<label>Email for checklist delivery</label>
<input name="email" type="email" required>

<button type="submit">Generate My TripClear Checklist</button>

</form>

<div id="status"></div>
</div>

<script>
document.getElementById("tripForm").addEventListener("submit", async function(e){
e.preventDefault();

document.getElementById("status").innerText = "Generating your TripClear checklist...";

const formData = new FormData(this);
const data = Object.fromEntries(formData.entries());

// explicitly collect selected airlines
const airlineSelect = document.querySelector('select[name="airlines"]');
const selectedAirlines = Array.from(airlineSelect.selectedOptions).map(o => o.value);

data.airlines = selectedAirlines.join("\n");

try {

const response = await fetch("https://script.google.com/macros/s/AKfycbwnIT-8LMqgLR5Wc-fJof98ohPDeKXXCeZe_JfMPG16AVqVb9zaDLNbMYfD_143FYpF/exec", {
method: "POST",
body: JSON.stringify(data)
});

const result = await response.json();

if(result.success){
document.getElementById("status").innerText =
"Your checklist is being generated and will arrive by email shortly ✈️";
} else {
document.getElementById("status").innerText =
"Something went wrong. Please try again.";
}

} catch(err){
document.getElementById("status").innerText =
"Connection issue. Please try again.";
}

});
</script>

</body>
</html>
