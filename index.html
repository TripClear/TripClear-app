<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripClear</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body {
font-family:'Inter',sans-serif;
background:#3f7899;
margin:0;
padding:30px 20px;
}

.container {
max-width:620px;
margin:auto;
background:white;
padding:0 40px 40px;
border-radius:14px;
box-shadow:0 18px 40px rgba(0,0,0,0.18);
}

h1{
text-align:center;
margin-bottom:30px;
font-size:32px;
font-weight:700;
letter-spacing:-0.2px;
color:#111;
}

label {
font-weight:600;
display:block;
margin-top:22px;
margin-bottom:6px;
font-size:14px;
color:#333;
letter-spacing:.2px;
}

input, textarea, select {
width:100%;
padding:14px;
border:1px solid #d9d9d9;
border-radius:10px;
font-size:16px;
box-sizing:border-box;
background:#ffffff;
transition:all .15s ease;
}

input:focus, textarea:focus, select:focus {
outline:none;
border:1px solid #3f7899;
box-shadow:0 0 0 3px rgba(63,120,153,.15);
}

button {
width:100%;
margin-top:30px;
padding:18px;
background:#000;
color:white;
border:none;
border-radius:12px;
font-size:18px;
font-weight:600;
cursor:pointer;
letter-spacing:.3px;
box-shadow:0 6px 14px rgba(0,0,0,0.18);
transition:all .15s ease;
}

button:hover {
transform:translateY(-1px);
box-shadow:0 8px 18px rgba(0,0,0,0.22);
}

#status {
text-align:center;
margin-top:20px;
font-weight:bold;
}

/* TripClear logo header */

.logo-header{
text-align:center;
margin-bottom:10px;
margin-top:5px;
}

.logo-header img{
max-width:220px;
margin-bottom:6px;
}

.tagline{
color:#666;
font-size:14px;
margin:0;
}
  
  /* Airline scrollbox styling */
select[multiple]{
height:160px;
background:white;
border:1px solid #e3e3e3;
padding:8px;
}

select[multiple] option{
padding:6px;
}

.card-header{
text-align:center;
padding:30px 20px 20px;
background:#3f7899;
border-radius:14px 14px 0 0;
}

.card-header img{
max-width:200px;
margin-bottom:10px;
}

.card-header h1{
color:white;
font-size:30px;
margin:0;
font-weight:600;
}
  
</style>
</head>

<body>

<div class="container">

<div class="card-header">
<img src="tripclear-logo.png" alt="TripClear logo">
<h1>TripClear Checklist Generator</h1>
</div>

<form id="tripForm">

<label>Departure country</label>
<input name="departure" required>

<label>Destination and layover countries</label>
<textarea name="route" required></textarea>

<p style="font-size:13px;color:#666;margin-top:4px;">
List all countries you will visit or transit through. Include layovers. Example: Turkey, Thailand, Japan
</p>
  
<label>Select airline(s)</label>

<select name="airlines" multiple required size="6">

<option>Lufthansa</option>
<option>Emirates</option>
<option>British Airways</option>
<option>Qatar Airways</option>
<option>Swiss International Airlines</option>
<option>KLM</option>
<option>Air France</option>
<option>United Airlines</option>
<option>American Airlines</option>
<option>Delta Air Lines</option>
<option>Korean Air</option>
<option>Etihad</option>

</select>

<p style="font-size:13px;color:#666;margin-top:4px;">
Hold <b>Ctrl</b> (Windows) or <b>Command</b> (Mac) to select multiple airlines.
</p>

<label>Cabin class</label>
<select name="cabin">
<option>Economy</option>
<option>Premium Economy</option>
<option>Business</option>
<option>First</option>
</select>

<label>What is the baggage plan for this trip?</label>
<select name="baggage_plan">
<option>Carry-on only</option>
<option>Carry-on + checked bag</option>
<option>Not sure</option>
</select>

<label>Would you like information on vaccination or immunization requirements for your destination(s)?</label>
<select name="vaccines">
<option>Yes</option>
<option>No</option>
</select>

<label>Does your trip include layovers?</label>
<select name="layovers">
<option selected>Yes</option>
<option>No</option>
</select>

<label>Traveling with Rx medication?</label>
<select name="rx">
<option>No</option>
<option>Yes</option>
</select>

<label>Email for checklist delivery</label>
<input name="email" type="email" required>

<button type="submit">Generate My TripClear Checklist</button>

</form>

<div id="status"></div>
</div>

<script>
document.getElementById("tripForm").addEventListener("submit", async function(e){
e.preventDefault();

document.getElementById("status").innerText = "Generating your TripClear checklist...";

const formData = new FormData(this);
const data = Object.fromEntries(formData.entries());

// explicitly collect selected airlines
const airlineSelect = document.querySelector('select[name="airlines"]');
const selectedAirlines = Array.from(airlineSelect.selectedOptions).map(o => o.value);

data.airlines = selectedAirlines.join("\n");

try {

const response = await fetch("https://script.google.com/macros/s/AKfycbwnIT-8LMqgLR5Wc-fJof98ohPDeKXXCeZe_JfMPG16AVqVb9zaDLNbMYfD_143FYpF/exec", {
method: "POST",
body: JSON.stringify(data)
});

const result = await response.json();

if(result.success){
document.getElementById("status").innerText =
"Your checklist is being generated and will arrive by email shortly ✈️";
} else {
document.getElementById("status").innerText =
"Something went wrong. Please try again.";
}

} catch(err){
document.getElementById("status").innerText =
"Connection issue. Please try again.";
}

});
</script>

</body>
</html>
